<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Seat Assigner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎒 Random Seat Assigner</h1>
    <form id="seatForm">
      <div class="form-group">
        <label>Number of Girls (Roll No starts from 1):</label>
        <input type="number" id="girls" required>
      </div>

      <div class="form-group">
        <label>Number of Boys (Roll No continues after girls):</label>
        <input type="number" id="boys" required>
      </div>

      <div class="form-group">
        <label>Number of Rows:</label>
        <input type="number" id="rows" required>
      </div>

      <div class="form-group">
        <label>Benches per Row:</label>
        <input type="number" id="benches" required>
      </div>

      <div class="form-group">
        <label>Students per Bench (should be 2):</label>
        <input type="number" id="perBench" value="2" required>
      </div>

      <button type="submit">🎲 Assign Seats</button>
    </form>

    <h2>📋 Seat Arrangement</h2>
    <div id="output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
